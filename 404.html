<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — IPL в Одинцово</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --olive-900: #23291d;
      --olive-700: #3c4632;
      --olive-500: #62704f;
      --olive-50: #f2f4ec;
      --gold-500: #b08d4f;
      --cream: #fbfaf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
      color: var(--olive-900);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 520px; }
    .mark {
      font-size: 60px;
      line-height: 1;
      color: var(--gold-500);
      margin-bottom: 18px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(30px, 6vw, 44px);
      margin: 0 0 14px;
    }
    p { color: var(--olive-500); margin: 0 0 28px; line-height: 1.6; }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--olive-700);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background-color .2s ease, transform .2s ease;
    }
    a.btn:hover { background: var(--olive-900); transform: translateY(-2px); }
    .hint { margin-top: 26px; font-size: 14px; color: var(--olive-500); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет — возможно, ссылка устарела или в адресе опечатка.</p>
    <a class="btn" href="/">На главную</a>
    <p class="hint">Кабинет лазерной эпиляции «IPL в Одинцово»</p>
  </div>
</body>
</html>
